spring.application.name=backend
server.port=8080

# Configuración Base de Datos H2
spring.datasource.url=jdbc:h2:mem:transportedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate (crea y actualiza las tablas automáticamente según tus @Entity)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave secreta para firmar los tokens JWT (mínimo 32 caracteres)
jwt.secret=ClaveSecretaSuperSeguraParaElProyectoTransporte2026DuocUC
jwt.expiration=86400000